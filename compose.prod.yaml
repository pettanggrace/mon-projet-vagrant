# Déploiement de production sur la VM (à la racine de mon-projet-vagrant/)
# - CI/CD : la VM télécharge l'image de l'app depuis GHCR (docker compose pull)
# - Observabilité : Prometheus (9090) + Grafana (3001) + node-exporter
name: todo

services:
  app:
    image: ${TODO_IMAGE:-ghcr.io/pettanggrace/mon-projet-vagrant/todo-app:latest}
    build: ./todo-list-app
    container_name: todo-app
    restart: unless-stopped
    ports:
      - "5111:3000"
    environment:
      SQLITE_DB_LOCATION: /etc/todos/todo.db
    volumes:
      - todo-data:/etc/todos

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    depends_on:
      - app
      - node-exporter

  grafana:
    image: grafana/grafana:12.1.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/todo-app.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave

volumes:
  todo-data:
  prometheus-data:
  grafana-data:
